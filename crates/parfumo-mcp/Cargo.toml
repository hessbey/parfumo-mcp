[package]
name = "parfumo-mcp"
description = "Local MCP server for Parfumo over stdio: one Parfumo account, read from the environment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# The 48 tools, the Parfumo session, the cache and the audit log.
parfumo-mcp-core = { version = "0.1.0", path = "../parfumo-mcp-core" }
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["net"] }
serde_json = "1.0.154"
url = "2.5.8"
