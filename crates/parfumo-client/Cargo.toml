[package]
name = "parfumo-client"
description = "HTTP client for parfumo.com: transport, routes, HTML parsing and models. Independent of MCP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
governor = "0.10.4"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "cookies", "gzip", "brotli", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync", "macros", "rt"] }
url = "2.5.8"
webpki-roots = "1.0.12"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }

[features]
# Raw request hook for the exploration example (jalon 0 bis). Never enabled by the server.
explore = []

[[example]]
name = "explore"
required-features = ["explore"]
