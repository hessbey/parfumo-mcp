
<div class="text-lg bold mb-1">New column</div>

<form class="psheet-column-form" data-id="0">
	<div class="mb-1">
		<input type="text" class="uk-input" maxlength="40" autofocus placeholder="Column name..." value="">
	</div>

			<div class="flex gap-1 mb-1">
							<div>
					<input type="radio" id="psheet_type_check" class="circle-s" name="type" value="check" checked>
					<label class="text-sm grey" for="psheet_type_check">Checkbox</label>
				</div>
							<div>
					<input type="radio" id="psheet_type_text" class="circle-s" name="type" value="text">
					<label class="text-sm grey" for="psheet_type_text">Text</label>
				</div>
							<div>
					<input type="radio" id="psheet_type_date" class="circle-s" name="type" value="date">
					<label class="text-sm grey" for="psheet_type_date">Date</label>
				</div>
					</div>
	
	<button class="pbtn pbtn-small pbtn-blue">Save</button>
</form>
