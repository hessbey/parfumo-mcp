	<script>
		maxlength(document.querySelector('.comment_input_22205264'), document.querySelector('.counter-container-comment-22205264'));

		$('.action_iwear').click(
			function() {
				pid = $(this).data('pid');
				btn = $(this);
				actionPopup(
					'Wearing this perfume right now?',
					'Only click <strong>Yes</strong> if you really wear the fragrance. Otherwise, your personal assistant cannot give you reliable tips.',
					'Cancel',
					'Just sprayed on!',
					'blue',
					function() {
						btn.remove();
						updateIWear(pid);
						hideActionPopup();
						iWearSpray();
					}
				);
			}
		);

		$('.action_iwear_delete').click(
			function() {
				actionPopup(
					'Delete entry',
					'Are you sure you want to delete this entry?',
					'Cancel',
					'Delete',
					'pink',
					function() {
						postAction('account/delete_iwear', {
							id: '22205264'
						}).then(() => {
							$('#tablerow22205264').fadeOut('fast');
							hideActionPopup();
						});
					}
				);
			}
		);

		$('.action_edit_date').click(function() {
			toggleWithArrows('.edit_date', '.arr-edit_date');
		});

		$('.action_save_date').click(function() {

			var date_input = $(this).parent().parent().find('input');
			var new_date = date_input.val();

			postAction('account/update_iwear_date', {
				id: '22205264',
				new_date: new_date
			}).then(response => response.text()).then(data => {
				if (data == '1') {
					toggleWithArrows('.edit_date', '.arr-edit_date');
					VanillaToasts.create({
						title: 'Date updated',
						text: 'Reload the page to see the changes.',
						type: 'green',
						timeout: 5000
					});
				} else {
					pAnimate('.edit_date', 'headShake');
				}
			});
		});

		$('.action_edit_comment').click(function() {
			toggleWithArrows('.edit_comment', '.arr-edit_comment');
			$('.comment_input_22205264').focus();
		});

		$('.action_save_comment').click(function() {
			var comment = $('.comment_input_22205264').val();
			postAction('account/update_iwear_comment', {
				id: '22205264',
				comment: comment
			}).then(response => response.text()).then(data => {
				if (data == '1') {
					$('.edit_comment').slideUp('fast');
					$('.tracker_details_22205264').html('<div class="ajax_loader_div"></div>');
					postAction('assistant/tracker_details', {
						l_id: '22205264'
					}).then(r => r.text()).then(function(data) {
						$('.tracker_details_22205264').html(data);
					});
				}
			});
		});

		$('.action_add_layering').click(function() {
			$('.layering_search').slideToggle('fast');
			$('#s_layering_22205264').focus();
		});

		$('#livesearch_layering_22205264').on('click', '.action_select_layering', function() {
			var p_id = $(this).data('id');
			postAction('account/update_iwear_layering', {
				id: '22205264',
				layered_with_id: p_id
			}).then(() => {
				$('.tracker_details_22205264').html('<div class="ajax_loader_div"></div>');
				postAction('assistant/tracker_details', {
					l_id: '22205264'
				}).then(r => r.text()).then(function(data) {
					$('.tracker_details_22205264').html(data);
				});
			});
		});

		$('.action_remove_layering_22205264').click(function() {
			postAction('account/update_iwear_layering', {
				id: '22205264',
				layered_with_id: 'clear'
			}).then(() => {
				$('.action_tracker_details[data-l_id="22205264"] .layer-pic').remove();
				$('.tracker_details_22205264').html('<div class="ajax_loader_div"></div>');
				postAction('assistant/tracker_details', {
					l_id: '22205264'
				}).then(r => r.text()).then(function(data) {
					$('.tracker_details_22205264').html(data);
				});
			});
		});
	</script>
