<script>
(function() {
	var form = document.getElementById('forum_compose_6af55c054b320');
	var rtApi = PRichtext.bind('forum_compose_6af55c054b320');
	if (rtApi.editor.hasAttribute('data-autosave')) { autoSave(rtApi.editor); }
	var photos = PPhotos.init(form.querySelector('[data-pphotos]'), form);

	var typeSelect = form.parentElement.querySelector('[data-topic-type]');
	if (typeSelect) {
		typeSelect.addEventListener('change', function() {
			var pick = typeSelect.closest('.forum-type-pick');
			pick.querySelector('[data-topic-type-label]').textContent = pick.getAttribute('data-title-' + typeSelect.value);
		});
	}
	var errorBox = form.querySelector('[data-error]');

	form.querySelector('[data-cancel]').addEventListener('click', function() {
		PModal.close();
	});

	var pollBox = form.querySelector('[data-poll]');
	if (pollBox) {
		var pollOpen = form.querySelector('[data-poll-open]');
		var list = pollBox.querySelector('[data-poll-options]');
		var nextOption = 1001;

		function optionRows() {
			return list.querySelectorAll('[name^="poll_option_text"]');
		}

		function addOptionRow() {
			var rows = optionRows();
			if (rows.length >= 6) { return; }
			if (rows.length > 0) { rows[rows.length - 1].placeholder = list.dataset.placeholder; }
			var input = document.createElement('input');
			input.type = 'text';
			input.maxLength = 255;
			input.name = 'poll_option_text[' + (nextOption++) + ']';
			input.placeholder = list.dataset.placeholderAdd;
			list.appendChild(input);
		}

		pollOpen.querySelector('button').addEventListener('click', function() {
			pollOpen.classList.add('hide');
			pollBox.classList.remove('hide');
			pollBox.querySelector('[name="poll_delete"]').value = 0;
			pollBox.querySelector('[name="poll_title"]').focus();
		});

		pollBox.querySelector('[data-poll-remove]').addEventListener('click', function() {
			optionRows().forEach(function(row) { row.remove(); });
			addOptionRow();
			pollBox.querySelector('[name="poll_title"]').value = '';
			pollBox.querySelector('[name="poll_length"]').value = 0;
			pollBox.querySelector('[name="poll_delete"]').value = 1;
			pollBox.classList.add('hide');
			pollOpen.classList.remove('hide');
		});

		list.addEventListener('input', function(e) {
			var rows = optionRows();
			if (e.target == rows[rows.length - 1] && e.target.value.trim() != '') {
				addOptionRow();
			}
		});

		list.addEventListener('focusout', function(e) {
			var rows = optionRows();
			if (e.target.name != 'poll_title' && e.target.value.trim() == '' && e.target != rows[rows.length - 1]) {
				e.target.remove();
			}
		});

		list.addEventListener('keydown', function(e) {
			if (e.key != 'Enter') { return; }
			e.preventDefault();
			var inputs = list.querySelectorAll('input');
			var index = Array.prototype.indexOf.call(inputs, e.target);
			if (inputs[index + 1]) { inputs[index + 1].focus(); }
		});
	}

	var subject = form.querySelector('[name="subject"]');
	(subject && subject.value == '' ? subject : rtApi.editor).focus({ preventScroll: true });

	form.addEventListener('submit', function(e) {
		e.preventDefault();
		var btn = form.querySelector('[data-submit]');
		if (btn.disabled) { return; }
		rtApi.sync();
		var btnText = btn.innerHTML;
		function restoreBtn() {
			btn.innerHTML = btnText;
			btn.style.width = '';
			btn.disabled = false;
		}
		btn.style.width = btn.offsetWidth + 'px';
		btn.innerHTML = '<i class="fa fa-spinner fa-spin fa-fw"></i>';
		btn.disabled = true;
		errorBox.classList.add('hide');
		fetch(form.dataset.endpoint, { method: 'POST', body: new FormData(form), credentials: 'same-origin' })
		.then(jsonResponse)
		.then(function(res) {
			if (res.ok && res.body.success) {
				if (rtApi.editor.hasAttribute('data-autosave')) { autoSaveClear(rtApi.editor); }
				(photos ? photos.upload(res.body.post_id) : Promise.resolve()).then(function() {
					if (form.hasAttribute('data-in-place') && document.getElementById(res.body.post_id)) {
						PModal.close();
						window.forumShowPosts({ post_id: res.body.post_id }, res.body.redirect);
						return;
					}
					forumGo(res.body.redirect);
				});
				return;
			}
			errorBox.textContent = res.body.error || '';
			errorBox.classList.remove('hide');
			restoreBtn();
		})
		.catch(restoreBtn);
	});
})();
</script>
