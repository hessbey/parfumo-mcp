				hover.textContent = e.detail == null ? voted : label(e.detail);

			stars.addEventListener("rated", function (e) {
				voted = label(e.detail);

							x.classList.remove("hide");
							x.style.display = "";
							pAnimate(x, "fadeIn");
						}
					});
				});
			});

			stars.addEventListener("pstars:reset", function () {
				voted = "0.0";
				hover.textContent = voted;
			});
		})();
