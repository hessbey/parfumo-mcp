<div class="flex items-center gap-0-5">
	<button class="wr-edit-save pbtn pbtn-small pbtn-blue" type="button">Save</button>
	<div class="wr-edit-lock pbtn pbtn-small pbtn-lightgrey2 pointer">
		<i class="fa fa-unlock"></i>
	</div>
	<span class="wr-edit-lock-label text-xs lightgrey hide">Private collection</span>
	<span class="flex-1"></span>
	<span class="wr-edit-delete text-xs lightgrey pointer">Delete</span>
</div>

<script>
	var wrEditId = 922018;
	var wrEditIcon = 17;
	var wrEditCsrf = '0123456789abcdef0123456789abcdef';
	var wrEditPanelId = $('.wr-edit-save').closest('.pm--panel').attr('id');

	maxlength(document.querySelector('.wr-edit-name'), document.querySelector('.counter-container-wr-edit-name'));
	maxlength(document.querySelector('.wr-edit-notes'), document.querySelector('.counter-container-wr-edit-notes'));

	$('.wr-panel-icon-option').click(function() {
		$('.wr-panel-icon-option').removeClass('active');
		$(this).addClass('active');
		wrEditIcon = $(this).data('icon');
	});

	$('.wr-edit-save').click(function() {
		var name = $('.wr-edit-name').val().trim();
		var notes = $('.wr-edit-notes').val().trim();

		if (name.length < 1 || name.length > 40) {
			pAnimate('.wr-edit-name', 'headShake');
			return;
		}

		$.post('/api/wardrobe/set_wardrobe_name_notes', {
			id: wrEditId,
			name: name,
			notes: notes,
			csrf_key: wrEditCsrf
		}, function(data) {
			var result = JSON.parse(data);
			$('.wr_name' + wrEditId).html(result.name);
			$('.wr_notes' + wrEditId).html(result.notes);
			PModal.close();
		});

		$.post('/api/wardrobe/set_wardrobe_icon', {
			id: wrEditId,
			icon: wrEditIcon,
			csrf_key: wrEditCsrf
		}, function(data) {
			$('.icon' + wrEditId).attr('src', data);
		});
	});

	$('.wr-edit-lock').click(function() {
		var btn = $(this);
		$.post('/api/wardrobe/wardrobe_lock_toggle', { id: wrEditId, csrf_key: wrEditCsrf }, function(data) {
			if (data == 'No') {
				btn.find('i').removeClass('fa-lock').addClass('fa-unlock');
				$('.wr-edit-lock-label').addClass('hide');
				$('.wr_lock' + wrEditId).addClass('hide');
			} else {
				btn.find('i').removeClass('fa-unlock').addClass('fa-lock');
				$('.wr-edit-lock-label').removeClass('hide');
				$('.wr_lock' + wrEditId).removeClass('hide');
			}
		});
	});

	$('.wr-edit-delete').click(function() {
		actionPopup(
			'Delete Collection',
			'Are you sure you want to delete this Collection? All perfumes will be removed from this collection.',
			'Cancel',
			'Delete',
			'pink',
			function() {
				$.post('/api/wardrobe/del_cust_wr', {
					csrf_key: wrEditCsrf,
					id: wrEditId
				}, function() {
					$('#row' + wrEditId).fadeOut('slow');
					hideActionPopup();
					PModal.close(wrEditPanelId);
				});
			}
		);
	});
</script>
