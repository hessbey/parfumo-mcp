# A release is made by pushing a tag `vX.Y.Z` that matches the version in Cargo.toml.
# It builds both binaries for Linux, macOS and Windows, attaches the archives and their
# checksums to a GitHub release, publishes the Docker image of the HTTP server for amd64
# and arm64 on ghcr.io, then the local program on npm (`npx parfumo-mcp`).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # Nothing is published unless the workflow runs for a version tag.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  binaries:
    name: binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Version
        id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$PUBLISH" = "true" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version of Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p parfumo-mcp -p parfumo-mcp-server
      - name: Both binaries start
        # The Intel macOS binaries are cross-compiled on an Apple silicon runner.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          target/${{ matrix.target }}/release/parfumo-mcp --version
          target/${{ matrix.target }}/release/parfumo-mcp-server --version
      - name: Archive
        run: |
          name="parfumo-mcp-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/parfumo-mcp.exe target/${{ matrix.target }}/release/parfumo-mcp-server.exe "$name/"
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/parfumo-mcp target/${{ matrix.target }}/release/parfumo-mcp-server "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            parfumo-mcp-*.tar.gz
            parfumo-mcp-*.zip
          if-no-files-found: error
          retention-days: 7
      # The local program alone, for the npm package of this system.
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/parfumo-mcp
            target/${{ matrix.target }}/release/parfumo-mcp.exe
          if-no-files-found: error
          retention-days: 7

  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/parfumo-mcp-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image for amd64 and arm64
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/parfumo-mcp-server"
          version="${GITHUB_REF_NAME#v}"
          tags="-t $image:$version"
          # A pre-release (v1.2.3-rc.1) does not move `latest`.
          case "$version" in *-*) ;; *) tags="$tags -t $image:latest" ;; esac
          docker buildx imagetools create $tags $(cd digests && printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$version"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum parfumo-mcp-* > SHA256SUMS && cat SHA256SUMS)
          flags="--verify-tag --generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" $flags

  # The local program on npm: one package per system, and `parfumo-mcp`, which starts the
  # one npm installed. Runs after the GitHub release, so that a problem on the npm side
  # never holds the release back: fix it, then "Re-run failed jobs".
  npm:
    name: npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Lets npm prove that the packages were built here (provenance), and publish without
      # a token, since the packages trust this workflow (trusted publishing).
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
      # No `registry-url` here: it would write a placeholder token that hides the real
      # error when trusted publishing is not set up.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm recent enough for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-bin
      - name: Packages
        run: |
          args=""
          for dir in npm-bin/npm-*; do
            args="$args --binary ${dir#npm-bin/npm-}=$(ls "$dir"/parfumo-mcp*)"
          done
          node npm/build.mjs --version "${GITHUB_REF_NAME#v}" --out npm-dist --all $args
      # npm proves to the registry that it runs in this workflow: no secret is involved.
      # Each package must list this repository and `release.yml` as its trusted publisher
      # on npmjs.com.
      - name: Publish without a token (trusted publishing)
        id: trusted
        continue-on-error: true
        run: npm/publish.sh npm-dist
      # Only when the step above failed and the repository still holds a token. Packages
      # already published are skipped.
      - name: Publish with the token of the repository (fallback)
        if: steps.trusted.outcome == 'failure' && env.HAS_TOKEN == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::warning::Trusted publishing failed: the packages were published with the NPM_TOKEN secret instead. Check the trusted publisher of each package on npmjs.com."
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm/publish.sh npm-dist
      - name: Nothing could publish
        if: steps.trusted.outcome == 'failure' && env.HAS_TOKEN != 'true'
        run: |
          echo "::error::Trusted publishing failed and the repository holds no NPM_TOKEN secret. Check the trusted publisher of each package on npmjs.com, then re-run this job."
          exit 1
